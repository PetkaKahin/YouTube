# Explicit module boundaries; app/common have no business layer hierarchy.
# Public imports only its own domain/application and standard library.
# Only app.module_providers may import module provider classes directly.
# Module tests exercise their own internals and allowed foreign publics.
source_roots = [
    "src",
    "tests",
    "migrations",
]
root_module = "forbid"
ignore_type_checking_imports = false
include_string_imports = true
forbid_circular_dependencies = true
respect_gitignore = true

[[modules]]
path = "app"
depends_on = [
    "common.contracts",
    "common.http",
    "common.infrastructure",
    "user.public",
    "video.public",
    "channel.public",
    "comment.public",
    "moderation.public",
    "app.module_providers",
]
visibility = [
    "app",
    "conftest",
    "job_support",
    "test_*",
    "env",
    "versions",
]

