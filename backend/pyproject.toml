[project]
name = "youtube-backend"
version = "0.0.0"
description = "YouTube educational project backend"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi==0.162.5", "uvicorn[standard]==0.54.0"]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "pytest==9.2.0",
    "ruff==0.17.4",
    "tach==0.35.3",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "/opt"
venv = "venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
