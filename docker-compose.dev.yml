services:
  python:
    environment:
      COOKIE_SECURE: 'false'
    build:
      target: dev
    volumes:
      - ./backend:/app
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --reload, --reload-dir, /app/src, --proxy-headers, --no-access-log]

  upload-maintenance:
    build:
      target: dev
    volumes:
      - ./backend:/app

  media-worker:
    build:
      target: dev
    volumes:
      - ./backend:/app

  node:
    build:
      target: dev
    restart: unless-stopped
    command: [npm, run, dev]
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  nginx:
    build:
      target: dev
    depends_on:
      node:
        condition: service_healthy

  rustfs:
    environment:
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '127.0.0.1:${RUSTFS_API_PORT:-9000}:9000'
      - '127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001'

volumes:
  node_modules:
