server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/snippets/api.conf;

    location = /index.html {
        add_header Cache-Control 'no-store';
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
