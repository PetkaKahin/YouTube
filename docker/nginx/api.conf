location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok\n';
}

location = /api {
    return 308 /api/;
}

location = /docs {
    return 308 /api/docs;
}

location ~ (^|/)\.env($|[./]) {
    return 404;
}

location ^~ /docker/secrets/ {
    return 404;
}

location ^~ /run/secrets/ {
    return 404;
}

location /api/ {
    proxy_pass http://api_backend/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    client_max_body_size 6g;
}

# Only API-issued X-Accel-Redirect may enter; never proxy arbitrary browser URIs.
location ^~ /_media_storage/ {
    internal;
    error_log /dev/null;
    limit_except GET { deny all; }
    proxy_pass http://rustfs:9000/;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host rustfs:9000;
    proxy_set_header Connection "";
    proxy_set_header Content-Length "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Range $media_upstream_range;
    proxy_force_ranges on;
    proxy_buffering off;
    proxy_cache off;
    proxy_hide_header Location;
    proxy_hide_header Refresh;
    proxy_hide_header Set-Cookie;
    proxy_hide_header WWW-Authenticate;
    proxy_hide_header X-Amz-Request-Id;
    proxy_hide_header X-Amz-Id-2;
    proxy_hide_header X-Amz-Version-Id;
    proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Buffering;
    proxy_intercept_errors on;
    include /etc/nginx/snippets/media-errors.conf;
    add_header Cache-Control 'no-store' always;
    add_header Vary Cookie always;
    add_header X-Content-Type-Options nosniff always;
}

location @media_not_found {
    default_type application/problem+json;
    add_header Cache-Control 'no-store' always;
    add_header Vary Cookie always;
    return 404 '{"code":"not_found","status":404}';
}

location @media_range_invalid {
    default_type application/problem+json;
    add_header Cache-Control 'no-store' always;
    add_header Vary Cookie always;
    add_header Content-Range $upstream_http_content_range always;
    return 416 '{"code":"invalid_range","status":416}';
}

location @media_upstream_failure {
    default_type application/problem+json;
    add_header Cache-Control 'no-store' always;
    add_header Vary Cookie always;
    return 502 '{"code":"media_unavailable","status":502}';
}

# Only signed multipart PUT requests reach storage; cookie credentials stay in API.
location ^~ /uploads/ {
    # Nginx error messages can include the full request URI with bearer signatures.
    error_log /dev/null;
    limit_except PUT { deny all; }
    proxy_pass http://rustfs:9000/;
    proxy_http_version 1.1;
    proxy_set_header Host rustfs:9000;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 16m;
    add_header Cache-Control 'no-store' always;
}
