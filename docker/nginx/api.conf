location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok\n';
}

location = /api {
    return 308 /api/;
}

location = /docs {
    return 308 /api/docs;
}

location ~ (^|/)\.env($|[./]) {
    return 404;
}

location ^~ /docker/secrets/ {
    return 404;
}

location ^~ /run/secrets/ {
    return 404;
}

location /api/ {
    proxy_pass http://python:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    client_max_body_size 6g;
}

# Only signed multipart PUT requests reach storage; cookie credentials stay in API.
location ^~ /uploads/ {
    # Nginx error messages can include the full request URI with bearer signatures.
    error_log /dev/null;
    limit_except PUT { deny all; }
    proxy_pass http://rustfs:9000/;
    proxy_http_version 1.1;
    proxy_set_header Host rustfs:9000;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 16m;
    add_header Cache-Control 'no-store' always;
}
