# Forward ordinary single ranges efficiently. Let Nginx evaluate If-Range and
# ranges against the storage response's actual ETag/length. Streaming responses
# may ignore multi-range and return 200 with the complete object.
map $http_range $media_single_range {
    default '';
    '~^bytes=(?:[0-9]+-[0-9]*|-[0-9]+)$' $http_range;
}
map $http_if_range $media_upstream_range {
    '' $media_single_range;
    default '';
}
